<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1770" viewBox="0 0 1600 1770"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1600" height="1770" fill="#f7f9fd"/>
<text x="45" y="50" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#24344c">当前流程架构 · Step 1 → Step 2 → Step 3</text>
<text x="45" y="86" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#24344c">按当前代码绘制｜蓝：前三轮成果　紫：L1–L4 输出　绿：最新 ClinVar 修复　灰：既有流程</text>
<rect x="465" y="115" width="680" height="105" rx="14" fill="#edf4ff" stroke="#527fb8" stroke-width="2"/>
<text x="485" y="149" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#527fb8">病例输入 · case JSON</text>
<text x="485" y="182" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">患者原始临床文本 + genotype（基因 / 转录本 / cDNA / 合子状态）</text>
<rect x="40" y="275" width="340" height="205" rx="14" fill="#fff" stroke="#758295" stroke-width="2"/>
<text x="60" y="309" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#758295">Step 1 · 确定性分子分析</text>
<text x="60" y="342" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">变异解析 / 转录本与 CDS</text>
<text x="60" y="371" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">变异类型、蛋白变化、NMD 等</text>
<text x="60" y="400" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">VariantProfile；不调用 LLM</text>
<text x="60" y="429" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">out/step1/&lt;case&gt;.json</text>
<polyline points="465,165 210,165 210,275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="415" y="250" width="1145" height="1100" rx="20" fill="none" stroke="#9eadd0" stroke-dasharray="8 6" stroke-width="2"/>
<text x="440" y="285" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#24344c">Step 2 · 疾病候选、证据判断与统一输出</text>
<rect x="445" y="315" width="520" height="200" rx="14" fill="#edf4ff" stroke="#527fb8" stroke-width="2"/>
<text x="465" y="349" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#527fb8">① 临床事实抽取 · 第一轮</text>
<text x="465" y="382" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">单次结构化抽取；必要时 LLM 选 HPO</text>
<text x="465" y="411" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">present / absent / possible / unknown</text>
<text x="465" y="440" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">区分患者事实与疾病综述，保留原文</text>
<text x="465" y="469" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">已有结果可复用，不重复抽取</text>
<rect x="995" y="315" width="535" height="200" rx="14" fill="#edfaf4" stroke="#218569" stroke-width="2"/>
<text x="1015" y="349" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#218569">② ClinVar 检索 · 本轮修复</text>
<text x="1015" y="382" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">完整转录本+cDNA / 无版本+cDNA</text>
<text x="1015" y="411" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">Gene+cDNA → 合并、Variation ID 去重</text>
<text x="1015" y="440" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">仅 ClinVar 空 ESearch 缓存：24 小时</text>
<text x="1015" y="469" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">保留逐路查询、原始来源与拒绝原因</text>
<polyline points="805,220 805,300 705,300 705,315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1145,165 1260,165 1260,315" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="550" width="520" height="155" rx="14" fill="#edf4ff" stroke="#527fb8" stroke-width="2"/>
<text x="465" y="584" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#527fb8">③ 表型辅助证据 · 第二轮 B3</text>
<text x="465" y="617" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">只用确定患者阳性 / 阴性；不混入疑似综述</text>
<text x="465" y="646" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">B1：剔除频率明确为 0 的阳性匹配记录</text>
<text x="465" y="675" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">B2：只计精确或祖先—后代关系匹配</text>
<rect x="995" y="550" width="535" height="155" rx="14" fill="#edfaf4" stroke="#218569" stroke-width="2"/>
<text x="1015" y="584" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#218569">④ 变异证据接受 · 复用原逻辑</text>
<text x="1015" y="617" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">变异匹配 → 必要时验证 CDS 版本等价</text>
<text x="1015" y="646" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">致病性过滤 → 疾病映射 → 候选证据</text>
<text x="1015" y="675" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">OTC：接受 11010；拒绝 161330</text>
<polyline points="705,515 705,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1260,515 1260,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="555" width="340" height="200" rx="14" fill="#fff" stroke="#758295" stroke-width="2"/>
<text x="60" y="589" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#758295">外部医学资源</text>
<text x="60" y="622" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">HPO / MONDO / GenCC 等</text>
<text x="60" y="651" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">G2P：关联、遗传方式、机制</text>
<text x="60" y="680" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">HGNC / GeneReviews 等</text>
<text x="60" y="709" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">本地资源快照 + HTTP 缓存</text>
<rect x="445" y="745" width="1085" height="155" rx="14" fill="#edf4ff" stroke="#527fb8" stroke-width="2"/>
<text x="465" y="779" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#527fb8">⑤ 候选评估 + Step 1 分子信息衔接 · 第二 / 三轮</text>
<text x="465" y="812" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">基因关联召回候选；逐候选评估遗传方式、证据及表型相似度</text>
<text x="465" y="841" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">变异类型 / NMD / 合子状态等 × G2P 等位与机制要求 → 分子条件与不确定性</text>
<text x="465" y="870" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">事实、预测和未知分开；Step 1 没有的致病性预测器结果不编造</text>
<polyline points="210,480 210,520 425,520 425,800 445,800" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="380,680 405,680 405,850 445,850" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="705,705 705,745" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1260,705 1260,745" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="935" width="1085" height="135" rx="14" fill="#edf4ff" stroke="#527fb8" stroke-width="2"/>
<text x="465" y="969" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#527fb8">⑥ 原有选择流程 + 不确定性保护</text>
<text x="465" y="1002" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">候选 / 支持与反对证据 / primary / alternatives / not_supported</text>
<text x="465" y="1031" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">MICA 仅辅助鉴别；分子证据缺失或矛盾保留不确定性，不强制唯一亚型</text>
<polyline points="985,900 985,935" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="1105" width="1085" height="210" rx="14" fill="#f5effc" stroke="#8257af" stroke-width="2"/>
<text x="465" y="1139" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#8257af">⑦ 确定性组装 L1–L4 · 第四轮（output.py）</text>
<text x="465" y="1172" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">L1：患者临床事实 + 完整分子遗传信息及原文</text>
<text x="465" y="1201" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">L2：疾病大类、已有诊断、诊断状态</text>
<text x="465" y="1230" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">L3：合理候选亚型、支持 / 反对证据、待核实信息、ClinVar 引用</text>
<text x="465" y="1259" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">L4：分子机制及证据状态；Pathogenic 不自动确认 GoF / LoF</text>
<polyline points="985,1070 985,1105" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="1380" width="1085" height="105" rx="14" fill="#f5effc" stroke="#8257af" stroke-width="2"/>
<text x="465" y="1414" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#8257af">Step 2 JSON · out/step2/&lt;case&gt;.json</text>
<text x="465" y="1447" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">保留 patient_facts / molecular_evidence / candidates 等旧字段 + layers（L1–L4）</text>
<polyline points="985,1315 985,1380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="445" y="1530" width="1085" height="125" rx="14" fill="#fff" stroke="#758295" stroke-width="2"/>
<text x="465" y="1564" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#758295">Step 3 · 现有疗法证据与 Evidence Ledger（本轮未改）</text>
<text x="465" y="1597" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">继续读取 case + Step 1 + Step 2 的既有字段；未迁移为仅消费 layers</text>
<text x="465" y="1626" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#24344c">3a–3e → out/step3/&lt;case&gt;.json → 既有报告组装与校验</text>
<polyline points="985,1485 985,1530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="40,380 20,380 20,1590 445,1590" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="1697" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#24344c">存储边界：patient_facts 属于 Step 2；layers 是 Step 2 输出契约，不是另建的跨步骤 Case Ledger。</text>
<text x="45" y="1733" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#24344c">发布状态：图示当前代码；本轮验收结果位于 out/clinvar-recall-fix-20261127/，正式结果及基线尚未刷新。</text>
</svg>